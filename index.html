<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Family H5 Demo</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: #eef1f5;
      color: #0d1b2d;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .phone {
      position: relative;
      width: 383px;
      height: 867px;
      min-height: 867px;
      overflow: hidden;
      background: linear-gradient(
        180deg,
        #e7bdb5 0%,
        #eecdc8 42%,
        #f8eeee 72%,
        #ffffff 100%
      );
    }

    .ui-match {
      --page-bg: #f5f7fb;
      --ink: #071527;
      --muted: #66758a;
      --hot: #ff0a67;
      --orange: #d84a24;
      --line: #dde5ef;
      --card-radius: 20px;
    }

    .phone.plain {
      background: #f5f8fc;
    }

    .phone.reset {
      background: #f5f8fc;
    }

    .phone.home {
      background: #f6f7fb;
    }

    .phone.legal {
      background: #fff;
    }

    .status-bar {
      position: relative;
      z-index: 5;
      height: 26px;
      padding: 0 20px 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(31, 33, 38, 0.72);
      font-size: 13px;
      line-height: 1;
    }

    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .status-left {
      gap: 9px;
    }

    .status-right {
      gap: 4px;
      font-weight: 600;
      transform: translateY(-1px);
    }

    .shield {
      position: relative;
      width: 11px;
      height: 12px;
      background: #5d5554;
      clip-path: polygon(50% 0, 92% 15%, 82% 68%, 50% 100%, 18% 68%, 8% 15%);
    }

    .shield::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 3px;
      width: 1px;
      height: 6px;
      background: rgba(255, 255, 255, 0.8);
    }

    .app-badge {
      position: relative;
      width: 8px;
      height: 9px;
      border: 1.5px solid #625958;
      border-radius: 1px;
    }

    .app-badge::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #625958;
      box-shadow: 0 3px 0 #625958;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      width: 11px;
      height: 10px;
    }

    .signal i {
      display: block;
      width: 2px;
      background: #504b4a;
    }

    .signal i:nth-child(1) {
      height: 3px;
    }

    .signal i:nth-child(2) {
      height: 5px;
    }

    .signal i:nth-child(3) {
      height: 8px;
    }

    .battery {
      position: relative;
      width: 8px;
      height: 13px;
      margin-left: 2px;
      border: 1px solid #504b4a;
      border-radius: 1px;
      background: #504b4a;
    }

    .battery::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 2px;
      width: 3px;
      height: 2px;
      border-radius: 1px 1px 0 0;
      background: #504b4a;
    }

    .nav-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 29px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .home-indicator {
      width: 101px;
      height: 4px;
      border-radius: 999px;
      background: #fff;
      transform: translateY(1px);
    }

    .legal .nav-bar {
      position: absolute;
    }

    .top-back {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #071527;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .top-back::before {
      content: "";
      width: 10px;
      height: 10px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
    }

    .locale {
      position: absolute;
      top: 15px;
      right: 20px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #101925;
      font-size: 14px;
      line-height: 20px;
    }

    .logo {
      position: absolute;
      display: block;
      width: 65px;
      height: 65px;
      border-radius: 15px;
    }

    .field {
      width: 100%;
      height: 47px;
      border: 1px solid #d9e0e8;
      border-radius: 10px;
      background: #f8fbff;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      padding: 0 18px 0 24px;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #243142;
      font-size: 17px;
      line-height: 47px;
      font-weight: 400;
    }

    .field input::placeholder {
      color: #8a9caf;
      opacity: 1;
    }

    .primary-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: #edf0f4;
      color: #91a1b2;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .primary-button.hot {
      background: #d64722;
      color: #fff;
      box-shadow: 0 3px 8px rgba(182, 55, 24, 0.26);
    }

    .eye-button {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #485b6d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .agreement {
      border: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      color: #6e7886;
      font-size: 14px;
      line-height: 22px;
      letter-spacing: 0;
    }

    .radio {
      width: 14px;
      height: 14px;
      margin-right: 5px;
      border: 1px solid #7c8793;
      border-radius: 50%;
      background: transparent;
      flex: 0 0 auto;
    }

    .radio.checked {
      border-color: #ff7553;
      background: radial-gradient(circle at center, #ff7553 0 42%, transparent 45%);
    }

    .radio.checked::after {
      content: "";
      display: block;
      width: 6px;
      height: 3px;
      margin: 3px 0 0 3px;
      border-left: 1.5px solid #fff;
      border-bottom: 1.5px solid #fff;
      transform: rotate(-45deg);
    }

    .agreement a {
      color: #2078ff;
      text-decoration: none;
    }

    .login-screen,
    .register-screen,
    .verify-screen,
    .reset-screen,
    .code-login-screen {
      position: relative;
      min-height: 786px;
    }

    .login-logo {
      top: 108px;
      left: 155px;
    }

    .login-form {
      position: absolute;
      top: 209px;
      left: 28px;
      width: 319px;
    }

    .login-form .field + .field {
      margin-top: 18px;
    }

    .login-form .primary-button {
      margin-top: 25px;
    }

    .links {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      color: #6e7886;
      font-size: 15px;
      line-height: 22px;
    }

    .links button {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
    }

    .divider {
      width: 1px;
      height: 15px;
      background: rgba(110, 120, 134, 0.58);
    }

    .login-form .agreement {
      margin-top: 18px;
    }

    .register-logo {
      top: 100px;
      left: 155px;
    }

    .register-form {
      position: absolute;
      top: 206px;
      left: 28px;
      width: 319px;
    }

    .register-form .primary-button {
      margin-top: 28px;
    }

    .register-form .agreement {
      margin-top: 18px;
    }

    .verify-title {
      position: absolute;
      top: 143px;
      left: 0;
      right: 0;
      margin: 0;
      color: #ff7656;
      font-size: 25px;
      line-height: 36px;
      font-weight: 700;
      text-align: center;
    }

    .verify-form {
      position: absolute;
      top: 203px;
      left: 32px;
      width: 319px;
    }

    .verify-form .field {
      height: 49px;
      padding-left: 25px;
    }

    .verify-form .field + .field {
      margin-top: 24px;
    }

    .verify-code-field {
      padding-right: 12px;
    }

    .resend-divider {
      width: 1px;
      height: 27px;
      margin: 0 15px 0 8px;
      background: #f1c0b8;
      flex: 0 0 auto;
    }

    .resend-button {
      border: 0;
      background: transparent;
      color: #556374;
      font-size: 15px;
      white-space: nowrap;
      padding: 0;
      line-height: 49px;
    }

    .verify-form .primary-button {
      margin-top: 25px;
    }

    .reset-screen {
      padding: 78px 19px 0 21px;
      background: #f5f8fc;
    }

    .reset-screen .top-back {
      top: 13px;
      left: 22px;
    }

    .reset-title {
      margin: 0 0 34px;
      color: #08182c;
      font-size: 26px;
      line-height: 37px;
      font-weight: 800;
    }

    .reset-label {
      margin: 0 0 12px;
      color: #6c788a;
      font-size: 15px;
      line-height: 22px;
    }

    .reset-form .field {
      width: 335px;
      height: 55px;
      border-radius: 27.5px;
      background: #f9fbfe;
      padding-left: 17px;
    }

    .reset-form .field input {
      font-size: 16px;
    }

    .reset-form .field + .field {
      margin-top: 16px;
    }

    .reset-code-field {
      padding-right: 17px;
    }

    .reset-code-button {
      border: 0;
      padding: 0 0 0 13px;
      border-left: 1px solid #e6edf5;
      background: transparent;
      color: #d94b2f;
      font-size: 15px;
      line-height: 24px;
      white-space: nowrap;
    }

    .reset-password-label {
      margin-top: 32px;
    }

    .reset-form .primary-button {
      height: 50px;
      margin-top: 49px;
      border-radius: 25px;
    }

    .code-login-logo {
      top: 104px;
      left: 160px;
      width: 64px;
      height: 64px;
    }

    .code-login-form {
      position: absolute;
      top: 236px;
      left: 34px;
      width: 319px;
    }

    .code-login-form .field {
      height: 46px;
      padding-left: 23px;
      border-radius: 9px;
    }

    .code-login-form .primary-button {
      height: 49px;
      margin-top: 29px;
      border-radius: 9px;
    }

    .code-login-form .agreement {
      margin-top: 18px;
    }

    .code-verify-form {
      position: absolute;
      top: 203px;
      left: 27px;
      width: 319px;
    }

    .code-verify-form .field {
      height: 49px;
      padding-left: 25px;
    }

    .code-verify-form .primary-button {
      margin-top: 27px;
    }

    .country-page {
      min-height: 786px;
      padding-bottom: 29px;
      background: #f5f8fc;
    }

    .country-header {
      position: relative;
      height: 61px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b182b;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 1px 0 rgba(17, 28, 46, 0.05);
    }

    .country-header .top-back {
      top: 12px;
      left: 11px;
    }

    .search-box {
      position: relative;
      width: 351px;
      height: 42px;
      margin: 6px 8px 0 16px;
      border: 1px solid #d5dde9;
      border-radius: 10px;
      background: #f9fbfe;
      display: flex;
      align-items: center;
      padding: 0 16px 0 44px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 10px;
      width: 19px;
      height: 19px;
      color: #506075;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #192638;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #617187;
    }

    .country-list {
      padding: 18px 0 60px 16px;
      color: #122033;
    }

    .country-letter {
      margin: 0 0 17px 0;
      color: #071527;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
    }

    .country-item {
      display: block;
      width: 280px;
      height: 48px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #223047;
      text-align: left;
      font-size: 17px;
      line-height: 48px;
    }

    .alphabet {
      position: absolute;
      right: 4px;
      top: 317px;
      width: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: #45566b;
      font-size: 11px;
      line-height: 12px;
      font-weight: 600;
    }

    .alphabet button {
      width: 15px;
      height: 12px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 12px;
    }

    .alphabet button:disabled {
      opacity: 0.28;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 108px;
      z-index: 30;
      transform: translateX(-50%);
      min-width: 148px;
      max-width: 320px;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(20, 26, 36, 0.84);
      color: #fff;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.mid {
      top: 410px;
      bottom: auto;
    }

    .legal-page {
      position: relative;
      height: 757px;
      overflow-y: auto;
      padding-bottom: 44px;
      background: #fff;
      color: #2a3542;
      scrollbar-width: none;
    }

    .legal-page::-webkit-scrollbar {
      display: none;
    }

    .legal-header {
      position: sticky;
      top: 0;
      z-index: 8;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #071527;
      font-size: 19px;
      line-height: 27px;
      font-weight: 700;
    }

    .legal-header .top-back {
      top: 21px;
      left: 13px;
    }

    .legal-content {
      padding: 26px 14px 0;
    }

    .legal-content h1 {
      margin: 0 0 13px;
      color: #26323f;
      font-size: 26px;
      line-height: 34px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .legal-date {
      margin: 0 0 16px;
      color: #7b8797;
      font-size: 14px;
      line-height: 24px;
    }

    .legal-content p {
      margin: 0 0 18px;
      color: #424e5c;
      font-size: 14px;
      line-height: 27px;
      font-weight: 400;
      text-align: left;
    }

    .legal-content strong {
      color: #2f3946;
      font-weight: 800;
    }

    .legal-content h2 {
      margin: 35px 0 18px;
      color: #162232;
      font-size: 23px;
      line-height: 32px;
      font-weight: 800;
    }

    .settings-page,
    .upgrade-page {
      position: relative;
      min-height: 786px;
      background: #fff;
      color: #0d1b2d;
    }

    .settings-page {
      padding: 74px 12px 29px;
    }

    .settings-page .top-back,
    .upgrade-page .top-back {
      top: 34px;
      left: 12px;
    }

    .page-title {
      position: absolute;
      top: 34px;
      left: 0;
      right: 0;
      margin: 0;
      color: #071527;
      font-size: 19px;
      line-height: 28px;
      font-weight: 800;
      text-align: center;
    }

    .setting-section-label {
      margin: 15px 0 10px;
      color: #68768a;
      font-size: 14px;
      line-height: 20px;
    }

    .setting-row {
      width: 350px;
      height: 54px;
      border: 1px solid #dce4ef;
      border-radius: 9px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 16px;
      color: #152338;
      font-size: 15px;
      line-height: 22px;
    }

    .setting-row + .setting-row {
      margin-top: 10px;
    }

    .setting-value {
      max-width: 185px;
      overflow: hidden;
      color: #56657a;
      text-align: right;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .row-arrow {
      width: 8px;
      height: 8px;
      margin-left: 14px;
      border-right: 2px solid #334155;
      border-bottom: 2px solid #334155;
      transform: rotate(-45deg);
      flex: 0 0 auto;
    }

    .upgrade-page {
      padding: 76px 8px 87px;
      background: #f4f7fb;
    }

    .upgrade-card {
      height: 268px;
      border-radius: 14px;
      background: #fff;
      padding: 18px 17px 0;
    }

    .upgrade-device-img {
      display: block;
      width: 92px;
      height: 70px;
      object-fit: contain;
      margin: 0 auto 7px;
      opacity: 0.48;
      transform: rotate(8deg);
    }

    .current-label {
      margin: 0;
      color: #69778b;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
    }

    .version {
      margin: 3px 0 17px;
      color: #102033;
      font-size: 16px;
      line-height: 24px;
      font-weight: 800;
      text-align: center;
    }

    .upgrade-divider {
      height: 1px;
      background: #e5ebf3;
    }

    .upgrade-info-title {
      margin: 16px 0 14px;
      color: #102033;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
    }

    .upgrade-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #102033;
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
    }

    .upgrade-info-row span:last-child {
      color: #56657a;
      font-size: 15px;
    }

    .tips-title {
      margin: 17px 0 7px;
      color: #172538;
      font-size: 15px;
      line-height: 22px;
      font-weight: 800;
    }

    .tips-list {
      margin: 0;
      padding-left: 17px;
      color: #748296;
      font-size: 14px;
      line-height: 25px;
    }

    .tips-list li::marker {
      color: #a9b4c4;
      font-size: 18px;
    }

    .firmware-button {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 55px;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: #e3e7ed;
      color: #9aa7ba;
      font-size: 17px;
      font-weight: 800;
    }

    .modal-layer {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unbind-dialog {
      width: 310px;
      min-height: 332px;
      border-radius: 22px;
      background: #fff;
      padding: 30px 17px 16px;
    }

    .unbind-dialog h2 {
      margin: 0 0 16px 6px;
      color: #071527;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
    }

    .unbind-dialog p {
      margin: 0 6px 8px;
      color: #68768a;
      font-size: 13px;
      line-height: 22px;
    }

    .unbind-dialog .danger-text {
      color: #ef1f2d;
    }

    .unbind-actions {
      margin-top: 18px;
      display: grid;
      gap: 11px;
    }

    .unbind-actions button {
      height: 45px;
      border-radius: 23px;
      font-size: 15px;
    }

    .unbind-main {
      border: 0;
      background: #d64722;
      color: #fff;
    }

    .unbind-danger {
      border: 0;
      background: #ef242b;
      color: #fff;
    }

    .unbind-cancel {
      border: 1px solid #f1c5ba;
      background: #fff;
      color: #d75a42;
    }

    .rename-dialog {
      width: 310px;
      min-height: 157px;
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
      align-self: center;
      transform: translateY(-21px);
    }

    .rename-dialog h2 {
      margin: 15px 0 12px;
      color: #071527;

    function showToast(message, next, type = "", duration = 1600) {
      clearTimeout(state.toastTimer);
      let toast = app.querySelector(".toast");
      if (!toast) {
        toast = document.createElement("div");
        app.appendChild(toast);
      }
      toast.className = `toast${type === "mid" ? " mid" : ""}`;
      toast.textContent = message;
      requestAnimationFrame(() => toast.classList.add("show"));
      state.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
        if (typeof next === "function") next();
      }, duration);
    }

    function mountLottieAnimations() {
      if (!window.lottie) return;
      app.querySelectorAll("[data-lottie]").forEach(container => {
        if (container.dataset.lottieMounted) return;
        container.dataset.lottieMounted = "true";
        window.lottie.loadAnimation({
          container,
          renderer: "svg",
          loop: true,
          autoplay: true,
          path: container.dataset.lottie
        });
      });
    }

        state.scheduleCategory = "默认";
        state.scheduleReminder = "日程开始时";
        state.scheduleRepeat = "永不";
        state.scheduleMembers = ["hello", "user"];
        state.scheduleAllDay = false;
        state.scheduleDialog = "";
        setRoute("#/schedule/create");
      }

      if (action === "edit-schedule") {
        state.scheduleTitle = "zwb";
        state.scheduleCategory = "工作";
        state.scheduleReminder = "日程开始时";
        state.scheduleRepeat = "永不";
        state.scheduleMembers = ["hello", "user"];
        state.scheduleAllDay = true;
        state.scheduleDialog = "";
        setRoute("#/schedule/edit");
      }

      if (action === "back-schedule") {
        state.scheduleDialog = "";
        setRoute(`#/schedule/${state.scheduleView || "day"}`);
      }

      if (action === "schedule-save") {
        const titleInput = app.querySelector("[data-schedule-title]");
        state.scheduleTitle = titleInput ? titleInput.value : state.scheduleTitle;
        state.scheduleDialog = "";
        showToast("日程已保存", () => setRoute(`#/schedule/${state.scheduleView || "day"}`), "mid", 900);
      }

      if (action === "schedule-delete") {
        state.scheduleDialog = "";
        showToast("事件已删除", () => setRoute(`#/schedule/${state.scheduleView || "day"}`), "mid", 900);
      }

      if (action === "schedule-toggle-all-day") {
        state.scheduleAllDay = !state.scheduleAllDay;
        render();
      }

      if (action === "schedule-start-date" || action === "schedule-end-date") {
        state.scheduleDialog = "date";
        render();
      }

      if (action === "schedule-reminder-dialog") {
        state.scheduleDialog = "reminder";
        render();
      }

      if (action === "schedule-repeat-dialog") {
        state.scheduleDialog = "repeat";
        render();
      }

      if (action === "schedule-category-dialog") {
        state.scheduleDialog = "category";
        render();
      }

      if (action === "schedule-members-dialog") {
        state.scheduleDialog = "members";
        render();
      }

      if (action === "schedule-members-reset") {
        state.scheduleMembers = [];
        render();
      }

      if (action === "schedule-dialog-close") {
        state.scheduleDialog = "";
        render();
      }

      if (action === "schedule-date-pick") {
        const day = Number(actionTarget.dataset.day);
        if (Number.isFinite(day)) {
          state.schedulePickedDay = day;
          render();
        }
      }

      if (action === "schedule-dialog-ok") {
        state.scheduleDialog = "";
        render();
      }

      if (action === "schedule-reminder-select") {
        state.scheduleReminder = actionTarget.dataset.value;
        render();
      }

      if (action === "schedule-repeat-select") {
        const value = actionTarget.dataset.value;
        state.scheduleRepeat = value === "不重复" ? "永不" : value;
        render();
      }

      if (action === "schedule-category-select") {
        state.scheduleCategory = actionTarget.dataset.value;
        render();
      }

      if (action === "app-settings") {
        setRoute("#/app-settings");
      }

      if (action === "account-password") {
        setRoute("#/account-password");
      }

      if (action === "timezone-sheet") {
        state.settingsDialog = "timezone";
        render();
      }

      if (action === "family-management") {
        state.familyMenu = "";
        state.settingsDialog = "";
        setRoute("#/family-management");
      }

      if (action === "family-home-menu") {
        event.stopPropagation();
        state.familyMenu = state.familyMenu === "home" ? "" : "home";
        render();
      }

      if (action === "open-family-shot") {
        state.currentFamily = "shot";
        state.familyMenu = "";
        setRoute("#/family/detail");
      }

      if (action === "open-family-home") {
        state.currentFamily = "home";
        state.familyMenu = "";
        setRoute("#/family/detail");
      }

      if (action === "family-member-menu") {
        state.familyMenu = state.familyMenu === "member" ? "" : "member";
        render();
      }

      if (action === "close-family-menu") {
        state.familyMenu = "";
        render();
      }

      if (action === "family-edit-name" || action === "family-edit-role" || action === "family-remove-member") {
        state.familyMenu = "";
        state.pendingToast =
          action === "family-edit-name" ? "已进入名称编辑" :
          action === "family-edit-role" ? "已进入角色编辑" :
          "移除成员为演示操作";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 900;
        render();
      }

      if (action === "add-member-sheet") {
        state.settingsDialog = "add-member";
        render();
      }

      if (action === "add-member-submit") {
        state.settingsDialog = "";
        state.pendingToast = "成员已添加";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 900;
        render();
      }

      if (action === "invite-member") {
        state.settingsDialog = "";
        state.pendingToast = "邀请二维码已生成";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 900;
        render();
      }

      if (action === "avatar-sheet") {
        state.settingsDialog = "avatar";
        render();
      }

      if (action === "theme-sheet") {
        state.settingsDialog = "theme";
        render();
      }

      if (action === "language-sheet") {
        state.settingsDialog = "language";
        render();
      }

      if (action === "device-settings") {
        state.settingsDialog = "";
        setRoute("#/device-settings");
      }

      if (action === "back-home") {
        setRoute("#/home");
      }

      if (action === "device-upgrade") {
        setRoute("#/device-upgrade");
      }

      if (action === "show-unbind") {
        state.settingsDialog = "unbind";
        render();
      }

      if (action === "show-rename") {
        state.settingsDialog = "rename";
        render();
      }

      if (action === "close-dialog") {
        state.settingsDialog = "";
        state.scheduleDialog = "";
        render();
      }

      if (action === "clear-name") {
        const input = app.querySelector(".rename-input");
        if (input) input.value = "";
      }

      if (action === "confirm-rename") {
        const input = app.querySelector(".rename-input");
        if (input && input.value.trim()) {
          state.deviceName = input.value.trim();
        }
        state.settingsDialog = "";
        render();
      }

      if (action === "country") {
        state.returnRoute = location.hash || "#/login";
        setRoute("#/country");
      }

      if (action === "toggle-device-menu") {
        state.deviceMenuOpen = !state.deviceMenuOpen;
        render();
      }

      if (action === "user-agreement") {
        event.preventDefault();
        event.stopPropagation();
        state.legalReturnRoute = location.hash || "#/login";
        if (location.hash === "#/app-settings") state.legalReturnRoute = "#/app-settings";
        setRoute("#/user-agreement");
      }

      if (action === "privacy-policy") {
        event.preventDefault();
        event.stopPropagation();
        state.legalReturnRoute = location.hash || "#/login";
        if (location.hash === "#/app-settings") state.legalReturnRoute = "#/app-settings";
        setRoute("#/privacy-policy");
      }

      if (action === "register") {
        setRoute("#/register");
      }

      if (action === "forgot-password") {
        setRoute("#/forgot-password");
      }

      if (action === "code-login") {
        setRoute("#/code-login");
      }

      if (action === "back-login") {
        setRoute("#/login");
      }

      if (action === "back-register") {
        setRoute("#/register");
      }

      if (action === "back-code-login") {
        setRoute("#/code-login");
      }

      if (action === "back-return") {
        setRoute(state.returnRoute || "#/login");
      }

      if (action === "back-legal") {
        setRoute(state.legalReturnRoute || "#/login");
      }

      if (action === "send-code") {
        const input = app.querySelector(".account-input");
        state.registeredAccount = input ? input.value.trim() : "";
        const checked = !!app.querySelector(".agreement .radio.checked");
        if (!state.registeredAccount) {
          showToast("请输入手机号或邮箱");
          return;
        }
        if (!checked) {
          showToast("请先勾选协议");
          return;
        }
        showToast("验证码发送成功", () => setRoute("#/verify-register"));
      }

      if (action === "resend-code") {
        showToast("验证码发送成功");
      }

      if (action === "reset-send-code") {
        showToast("验证码发送成功，请查收");
      }

      if (action === "code-resend") {
        showToast("验证码发送成功，请查收", null, "mid", 5000);
      }

      if (action === "finish-register") {
        showToast("注册成功", () => setRoute("#/home"));
      }

      if (action === "reset-confirm") {
        showToast("密码重置成功", () => setRoute("#/login"));
      }

      if (action === "code-login-submit") {
        const account = app.querySelector("[data-code-account]");
        if (account && !account.value.trim()) {
          showToast("请输入手机号或邮箱");
          return;
        }
        state.pendingToast = "验证码发送成功，请查收";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 5000;
        setRoute("#/code-login-verify");
      }

      if (action === "code-verify-submit") {
        showToast("登录成功", () => setRoute("#/home"));
      }

      if (action === "login-submit") {
        const account = app.querySelector("[data-login-account]");
        const password = app.querySelector("[data-login-password]");
        if (account && !account.value.trim()) {
          showToast("请输入手机号或邮箱");
          return;
        }
        if (password && !password.value.trim()) {
          showToast("请输入密码");
          return;
        }
        const checked = state.loginAgreement || !!app.querySelector(".agreement .radio.checked");
        if (!checked) {
          showToast("请先勾选协议");
          return;
        }
        showToast("登录成功", () => setRoute("#/home"), "mid", 700);
        return;
      }

      if (action === "account-password") {
        setRoute("#/account-password");
      }

      if (action === "logout") {
        showToast("已退出登录", () => setRoute("#/login"));
      }

      if (action === "account-delete") {
        showToast("账号注销为演示操作");
      }

      if (action === "device-timezone" || action === "app-timezone") {
        showToast("已打开时区选择");
      }

      if (action === "timezone-sheet") {
        state.settingsDialog = "timezone";
        render();
      }

      if (action === "firmware-upgrade") {
        showToast("当前已是最新版本");
      }

      if (action === "scan-code") {
        showToast("已打开扫码添加");
      }

      if (action === "add-device") {
        state.deviceMenuOpen = false;
        setRoute("#/device/add");
      }

      if (action === "select-device-model") {
        showToast(`${actionTarget.dataset.model || "设备"} 添加成功`, () => setRoute("#/home"));
      }

      if (action === "scan-nearby-device") {
        setRoute("#/device/scan");
      }

      if (action === "send-photo") {
        showToast("设备未连接，暂不可发送");
      }

      if (action === "date-prev" || action === "date-next") {
        showToast(action === "date-prev" ? "已切换到上一页日期" : "已切换到下一页日期");
      }

      if (action === "list-filter-category") {
        app.querySelectorAll(".category-chip").forEach(item => item.classList.remove("active"));
        actionTarget.classList.add("active");
      }

      if (action === "list-filter-reset") {
        app.querySelectorAll(".category-chip").forEach((item, index) => item.classList.toggle("active", index === 0));
        showToast("已重置筛选");
      }

      if (action === "remove-subitem") {
        const row = actionTarget.closest(".subitem-field");
        if (row) row.remove();
      }

      if (action === "copy-list") {
        state.settingsDialog = "";
        showToast("已复制清单");
        render();
      }

      if (action === "task-time-toggle") {
        state.taskTimeEnabled = !state.taskTimeEnabled;
        render();
      }

      if (action === "task-member-pick") {
        app.querySelectorAll(".task-member-pick .member-item").forEach(item => item.classList.remove("selected"));
        actionTarget.classList.add("selected");
      }

      if (action === "reward-exchange") {
        showToast(actionTarget.classList.contains("disabled") ? "积分不足，暂不可兑换" : "兑换申请已提交");
      }

      if (action === "reward-form-member") {
        const group = actionTarget.closest(".reward-assign-row");
        if (group) group.querySelectorAll(".reward-member").forEach(item => item.classList.remove("selected"));
        actionTarget.classList.add("selected");
      }

      if (action === "reward-image-picker" || action === "recipe-upload" || action === "avatar-camera" || action === "avatar-album") {
        state.settingsDialog = "";
        showToast("已打开图片选择");
        render();
      }

      if (action === "template-search") {
        showToast("已打开搜索");
      }

      if (action === "template-delete") {
        showToast("已进入模板管理");
      }

      if (action === "gallery-toggle-view") {
        state.galleryLayout = state.galleryLayout === "list" ? "grid" : "list";
        state.pendingToast = state.galleryLayout === "list" ? "已切换为列表视图" : "已切换为网格视图";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 700;
        render();
      }

      if (action === "toggle-reward-template") {
        state.rewardSaveTemplate = !state.rewardSaveTemplate;
        render();
      }

      if (action === "toggle-meal-category") {
        const index = Number(actionTarget.dataset.mealCategoryIndex);
        if (Number.isFinite(index)) {
          state.disabledMealCategories = state.disabledMealCategories.includes(index)
            ? state.disabledMealCategories.filter(item => item !== index)
            : [...state.disabledMealCategories, index];
          render();
        }
      }

      if (action === "meal-color-pick") {
        state.mealCategoryColor = actionTarget.dataset.color || state.mealCategoryColor;
        render();
      }

      if (action === "meal-clear-all" || action === "meal-repeat-yesterday") {
        state.settingsDialog = "";
        state.pendingToast = action === "meal-clear-all" ? "已清除当前餐食计划" : "已重复前一天餐食";
        state.pendingToastType = "mid";
        state.pendingToastDuration = 800;
        render();
      }

      if (action === "recipe-add-plan") {
        showToast(state.selectedRecipes.length ? `已添加 ${state.selectedRecipes.length} 个食谱到计划` : "请选择食谱后添加到计划");
      }

      if (action === "recipe-select") {
        if (event.target.closest(".recipe-row-more")) return;
        const name = actionTarget.dataset.recipeName;
        if (name) {
          state.selectedRecipes = state.selectedRecipes.includes(name)
            ? state.selectedRecipes.filter(item => item !== name)
            : [...state.selectedRecipes, name];
          render();
        }
      }

      if (action === "recipe-category-select") {
        state.recipeCategory = actionTarget.dataset.value || state.recipeCategory;
        render();
      }

      if (action === "relation-pick") {
        const group = actionTarget.closest(".relation-chips");
        if (group) group.querySelectorAll(".relation-chip").forEach(item => item.classList.remove("active"));
        actionTarget.classList.add("active");
      }

      if (action === "member-color-pick") {
        const group = actionTarget.closest(".member-color-row");
        if (group) group.querySelectorAll(".member-color-dot").forEach(item => item.classList.remove("active"));
        actionTarget.classList.add("active");
      }

      if (action === "toggle-password") {
        const field = actionTarget.closest(".field");
        const input = field ? field.querySelector(".password-input") : null;
        if (input) input.type = input.type === "password" ? "text" : "password";
      }

      if (action === "toggle-agreement") {
        const radio = actionTarget.querySelector(".radio");
        if (radio) {
          radio.classList.toggle("checked");
          if (location.hash === "#/login") {
            state.loginAgreement = radio.classList.contains("checked");
            render();
          }
        }
      }
    });

    app.addEventListener("input", event => {
      const countryInput = event.target.closest("[data-country-search]");
      if (countryInput) {
        state.countrySearch = countryInput.value;
        render();
        const nextInput = app.querySelector("[data-country-search]");
        if (nextInput) {
          nextInput.focus();
          const pos = nextInput.value.length;
          nextInput.setSelectionRange(pos, pos);
        }
        return;
      }
    });

    app.addEventListener("keydown", event => {
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"][data-action]')) {
        event.preventDefault();
        event.target.click();
        return;
      }
      if (event.key !== "Enter") return;
      const field = event.target.closest("input, textarea");
      if (!field || field.tagName === "TEXTAREA") return;
      const submit = app.querySelector(".primary-button, .form-save, .task-save-button, .reward-save, .recipe-submit");
      if (submit) {
        event.preventDefault();
        submit.click();
      }
    });

    window.addEventListener("hashchange", render);

    if (!location.hash) {
      history.replaceState(null, "", "#/login");
    }
    render();
  </script>
</body>
</html>
